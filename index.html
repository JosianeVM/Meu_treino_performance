.exercise{padding:0;overflow:hidden}.ex-toggle{width:100%;display:flex;gap:11px;align-items:center;text-align:left;border:0;background:#fff;padding:14px;color:inherit}.ex-toggle .exname{font-size:14px}.ex-chevron{color:var(--pink-dark);font-size:19px;margin-left:auto;transition:transform .2s}.exercise.open .ex-chevron{transform:rotate(180deg)}.exercise-detail{display:none;padding:0 14px 15px;border-top:1px solid var(--line)}.exercise.open .exercise-detail{display:block}.demo-frame{margin:13px 0 10px;border:1px solid #f0dce5;border-radius:15px;background:linear-gradient(145deg,#fff8fb,#fff);overflow:hidden;min-height:170px;display:grid;place-items:center}.demo-frame img{display:block;width:100%;max-height:260px;object-fit:contain;background:#fff}.gif-caption{font-size:10px;color:#9b4c6d;padding:7px 9px;background:#fff5f9;text-align:center}.demo-wait{padding:24px 14px;text-align:center;color:var(--muted);font-size:12px}.demo-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.demo-actions button{border:1px solid #efcfdd;background:#fff7fa;color:var(--pink-dark);border-radius:10px;padding:9px 12px;font-weight:750;font-size:11px}.detail-heading{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--pink-dark);font-weight:850;margin:13px 0 8px}.muscle-overlay{position:fixed;inset:0;background:rgba(40,25,33,.42);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:12px}.muscle-overlay.show{display:flex}.muscle-sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 40px #0002}.muscle-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.muscle-top h2{font-size:18px;margin:0}.muscle-close{border:0;background:var(--pink-soft);color:var(--pink-dark);border-radius:50%;width:34px;height:34px;font-size:20px}.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.bodyfigure{border:1px solid var(--line);border-radius:14px mary span{font-size:9px;color:var(--muted)}.instruction{font-size:12px;line-height:1.55;color:#725d67;background:#fff8fb;border-left:3px solid #e6a4bd;padding:10px;border-radius:0 10px 10px 0;margin:10px 0}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.detail-actions button,.tips-toggle{border:1px solid var(--line);background:#fff;color:var(--pink-dark);padding:9px 12px;border-radius:10px;font-size:11px;font-weight:750}.tips-box{display:none;background:#fff8fb;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;line-height:1.55;color:#705965;margin:8px 0}.tips-box.show{display:block}.exercise-clock{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff7fa;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin:10px 0}.exercise-clock b{font-size:19px;font-variant-numeric:tabular-nums}.exercise-clock small{display:block;color:var(--muted);font-size:10px}.clock-buttons{display:flex;gap:5px}.clock-buttons button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;color:var(--pink-dark);font-size:10px;font-weight:750}.set-item{border:1px solid var(--line);border-radius:12px;padding:9px;margin:8px 0}.setrow{display:grid;grid-template-columns:55px 1fr 1fr 34px;gap:6px;align-items:center}.set-rest{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}.set-rest small{color:var(--muted);font-size:10px}.set-rest button{border:0;border-radius:9px;background:var(--pink-soft);color:var(--pink-dark);font-size:10px;font-weight:800;padding:8px 10px}.set-rest b{font-variant-numeric:tabular-nums;font-size:12px}.home-note{font-size:11px;color:var(--muted);line-height:1.5;margin:0 2px 12px}
</style></head><body>
<header class="top"><div class="topin"><div class="brand"><div class="bow">୨୧</div><div><small>FITNESS • TREINO</small><strong>Meu Treino</strong></div></div><div class="topright">Plano de hipertrofia</div></div></header><main id="app"></main><nav class="tabs"><div class="tabsin"><button class="tab active" data-tab="home"><span>⌂</span>Início</button><button class="tab" data-tab="progress"><span>↗</span>Progresso</button><button class="tab" data-tab="history"><span>▤</span>Histórico</button></div></nav><div class="toast" id="toast"></div><div class="muscle-overlay" id="muscleOverlay" onclick="if(event.target===this)closeMuscles()"><section class="muscle-sheet" id="muscleSheet"></section></div>
<script>
const plans=[
{ id:1,title:'Inferiores — Posterior e glúteos',kind:'Inferiores',items:[
['Elevação de Quadril com Barra','3 séries quebradas: 10 + 4 + 3','120s','10 reps; descanso de 10–15s; +4 reps; descanso de 10–15s; +3 reps.'],
['Mesa Flexora','3 séries: 8, 10 e 12 reps','90s','Começar pesado e reduzir a carga a cada série.'],
['Agachamento Sumô','4 × 8 a 12','60s','Alternar com Cadeira Flexora.'],
['Cadeira Flexora','4 × 10 a 15','60s','Alternar com Agachamento Sumô.'],
['Búlgaro com Halter','3 × 8 a 12','60s','Intervalo entre as pernas.'],
['Abdução de Quadril Máquina','3 × 10 a 15','60s','Segurar 3 segundos na posição aberta em cada repetição.']]},
{ id:2,title:'Superiores — Dia 1',kind:'Superiores',items:[
['Abdominal Prancha Isométrica','3 × 1 minuto','—','Manter a posição isométrica.'],['Abdominal Remador','3 × 10 a 15','60s',''],['Supino Inclinado com Halteres','4 × 8 a 12','60s',''],['Peck Deck','4 × 10 a 15','60s',''],['Elevação Frontal com Halteres','4 × 10 a 15','60s','Alternar com Elevação Lateral Sentado.'],['Elevação Lateral Sentado com Halteres','4 × 10 a 15','60s','Alternar com Elevação Frontal.'],['Tríceps na Polia com Corda','3 × 10 a 15','60s','Com agachamento com step, conforme orientação do instrutor.'],['Tríceps Unilateral na Polia Alta (Pegada Neutra)','3 × 8 a 12','60s','']]},
{ id:3,title:'Inferiores — Quadríceps e foco geral',kind:'Inferiores',items:[
['Agachamento Livre com Barra','4 × 10 + afundo','60s','Cadência 3–1–1: 3s descendo, 1s de pausa e 1s subindo.'],['Cadeira Extensora','4 séries quebradas: 10 + 8 + 6','120s','10 reps; descanso de 10–15s; +8 reps; descanso de 10–15s; +6 reps. Associado à flexão nórdica reversa.'],['Leg Press 45','3 × 8 a 12','60s','Alternar com Passada com Halteres.'],['Passada com Halteres','3 × ida e volta','60s','Alternar com Leg Press 45.'],['Subida no Step','3 séries quebradas: 10 + 6 + 4','60s','10 reps; descanso de 10–15s; +6 reps; descanso de 10–15s; +4 reps.'],['Abdução de Quadril Máquina','3 × 15 a 20','60s','']]},
{ id:4,title:'Superiores — Costas e bíceps',kind:'Superiores',items:[
['Abdominal Prancha Isométrica','3 × 1 minuto','60s',''],['Remada Unilateral Halteres — Pegada Neutra (Serrote)','3 × 10 a 15','60s',''],['Remada Cavalinho (Pegada Pronada)','4 × 8 a 12','60s',''],['Puxada Articulada Aberta','4 × 10 a 15','60s','Associada à remada alta.'],['Desenvolvimento com Anilha','4 × 10 a 15','60s','Alternar com Elevação Lateral Sentado.'],['Elevação Lateral Sentado com Halteres','4 × 10 a 15','60s','Alternar com Desenvolvimento com Anilha.'],['Rosca Alternada com Halteres','3 × 10 a 15','60s','Com agachamento com step, conforme orientação do instrutor.'],['Rosca Direta na Polia Baixa com Corda','3 × 8 a 12','60s','']]},
{ id:5,title:'Glúteos — Ênfase específica',kind:'Inferiores',items:[
['Abdução de Quadril Máquina com Corpo à Frente','4 × 10 a 15','60s','Mesma carga e repetições em todas as séries; associado ao banco romano.'],['Stiff Unilateral','1ª: 12 • 2ª: 10 • 3ª: 8','90s','Aumentar a carga à medida que diminuem as repetições.'],['Glúteos Coice na Polia','1 × 8, 10 e 12','90s','Drop-set: começar pesado e reduzir a carga.'],['Cadeira Extensora','3 × 10 cada lado','60s','Após 10 reps com carga normal, reduzir 20% e continuar até a falha.'],['Passada com Halteres','3 × ida e volta','60s','Percurso indicado: piso verde.']]}
];
const KEY='meutreino_instrutor_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}');let currentTab='home',currentPlan=1,timerId=null,remaining=0;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function getEx(p,i){return data[p+'-'+i]||(data[p+'-'+i]={sets:{}})}function setsFor(ex){let m=ex.match(/^(\d+)\s*[×x]/i);if(m)return +m[1];if(ex.startsWith('3 séries'))return 3;return 3}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}function completed(p,i){let x=data[p+'-'+i];return !!(x&&x.done)}function totalDone(){let n=0;plans.forEach(p=>p.items.forEach((_,i)=>{if(completed(p.id,i))n++}));return n}function totalEx(){return plans.reduce((a,p)=>a+p.items.length,0)}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));if(currentTab==='home')home();if(currentTab==='progress')progress();if(currentTab==='history')historyPage()}
function home(){let done=totalDone(),pct=Math.round(done/totalEx()*100);document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Seu plano de treino</div><h1>Constância traz resultados.</h1><p>As cinco fichas estão organizadas em sequência. Toque em um dia para abrir os exercícios e depois toque em cada exercício para ver a demonstração, séries, dicas e cronômetros.</p><div class="stats"><div class="stat"><b>${plans.length}</b><span>fichas</span></div><div class="stat"><b>${totalEx()}</b><span>exercícios</span></div><div class="stat"><b>${pct}%</b><span>concluído</span></div></div><div class="progressbar"><i style="width:${pct}%"></i></div></section><div class="sectionhead"><h2>Todos os treinos</h2><span>A a E · na ordem do instrutor</span></div><p class="home-note">Toque em qualquer ficha para abrir a lista. Os dias ficam todos nesta mesma página, um abaixo do outro.</p><div class="day-stack">${plans.map(p=>{let d=p.items.filter((_,i)=>completed(p.id,i)).length;return `<section class="day-panel" id="day-${p.id}"><button class="day-head" type="button" data-day-open="${p.id}"><span class="day-letter">${String.fromCharCode(64+p.id)}</span><span class="day-head-main"><b>Treino ${String.fromCharCode(64+p.id)} · ${p.title}</b><small>${p.items.length} exercícios · ${d}/${p.items.length} concluídos</small></span><span class="arrow">⌄</span></button><div class="day-content"><div class="progressbar"><i style="width:${d/p.items.length*100}%"></i></div>${p.items.map((it,i)=>exerciseCard(p.id,it,i)).join('')}</div></section>`}).join('')}</div>`;document.querySelectorAll('[data-day-open]').forEach(b=>b.onclick=()=>{let panel=document.getElementById('day-'+b.dataset.dayOpen);panel.classList.toggle('open')});wireExercise()}
function planCard(id){let p=plans[id-1],n=p.items.filter((_,i)=>completed(id,i)).length;return `<article class="workout-card"><div class="wtop"><span class="tag">TREINO ${String.fromCharCode(64+id)} • ${p.kind.toUpperCase()}</span><span class="small">${n}/${p.items.length} concluídos</span></div><h3>${p.title}</h3><div class="sub">${p.items.length} exercícios · Hipertrofia específico · Iniciante</div><div class="progressbar"><i style="width:${n/p.items.length*100}%"></i></div><div class="meta"><span>◷ Descansos conforme ficha</span><span>♡ Registro de cargas</span></div><div class="rowbtn"><button class="primary" id="startPlan">Abrir treino</button></div></article>`}
function openPlan(id){currentPlan=id;currentTab='workout';renderWorkout()}
function renderWorkout(){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));let p=plans[currentPlan-1],n=p.items.filter((_,i)=>completed(currentPlan,i)).length;document.getElementById('app').innerHTML=`<button class="back" id="back">← Voltar às fichas</button><div class="eyebrow">TREINO ${String.fromCharCode(64+currentPlan)} • ${p.kind}</div><h1 class="page-title">${p.title}</h1><p class="small">${n} de ${p.items.length} exercícios concluídos</p><div class="progressbar"><i style="width:${n/p.items.length*100}%"></i></div><div class="timerbox"><div class="eyebrow">Cronômetro de descanso</div><div class="timer" id="timer">${fmt(remaining||90)}</div><div class="timeractions"><button class="secondary" id="timerStart">Iniciar 90s</button><button class="secondary" id="timerPause">Pausar</button><button class="secondary" id="timerReset">Zerar</button></div></div>${p.items.map((it,i)=>exerciseCard(p.id,it,i)).join('')}`;document.getElementById('back').onclick=()=>{currentTab='home';render()};document.getElementById('timerStart').onclick=()=>startTimer(90);document.getElementById('timerPause').onclick=()=>{clearInterval(timerId);timerId=null};document.getElementById('timerReset').onclick=()=>{clearInterval(timerId);timerId=null;remaining=0;document.getElementById('timer').textContent='00:00'};wireExercise()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function startTimer(sec){clearInterval(timerId);remaining=sec;document.getElementById('timer').textContent=fmt(remaining);timerId=setInterval(()=>{remaining--;let el=document.getElementById('timer');if(el)el.textContent=fmt(Math.max(0,remaining));if(remaining<=0){clearInterval(timerId);timerId=null;toast('Descanso finalizado')}} ,1000)}

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function findGif(name){const cfg=demoMap[name];if(!cfg||!gifCatalog.length)return null;let best=null,bestScore=0;for(const e of gifCatalog){let nm=norm([e.name,e.slug].join(' '));if(!nm)continue;let score=0;for(const term of cfg.terms){let t=norm(term);if(nm===t)score=Math.max(score,130);else if(nm.includes(t))score=Math.max(score,100+Math.min(t.length,20));else if(t.includes(nm)&&nm.length>7)score=Math.max(score,80+nm.length)}if(score>bestScore){best=e;bestScore=score}}return bestScore>=82?best:null}
async function loadExerciseGifs(){try{let r=await fetch(GIF_BASE+'/api/es/exercises.json');if(!r.ok)throw Error('API indisponível');let d=await r.json();gifCatalog=Array.isArray(d)?d:(d.exercises||d.data||[]);gifReady=true;document.querySelectorAll('[data-gif-name]').forEach(el=>fillGif(el,el.dataset.gifName))}catch(e){gifReady=false;document.querySelectorAll('.demo-wait').forEach(el=>el.textContent='Não foi possível carregar a demonstração agora. Verifique a conexão com a internet.')}}
function fillGif(el,name){let match=findGif(name);if(match){let url=match.gifUrl||GIF_BASE+'/'+(match.file||match.id+'.gif');el.innerHTML=`<img src="${url}" alt="Demonstração de ${name}" loading="lazy"><div class="gif-caption">Demonstração animada do movimento</div>`}else{el.innerHTML=`<div class="demo-wait">Demonstração em GIF não encontrada para este movimento.<br><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' execução exercício')}" target="_blank" rel="noopener">Ver demonstração em vídeo ↗</a></div>`}}
function muscleSvg(groups,back){const on=(g)=>groups.includes(g);return `<svg viewBox="0 0 180 260" role="img" aria-label="Mapa muscular ${back?'posterior':'anterior'}"><g stroke="#c9b9c1" stroke-width="2" stroke-linejoin="round" fill="#f8edf2"><circle cx="90" cy="22" r="15"/><path d="M77 40 Q90 34 103 40 L112 54 108 105 100 127 80 127 72 105 68 54Z"/><path d="M68 52 L49 61 33 111 42 116 62 83 72 72Z M112 52 L131 61 147 111 138 116 118 83 108 72Z"/><path d="M80 125 L100 125 105 174 101 224 91 226 87 177 83 226 73 224 75 174Z"/><path d="M73 224 L87 226 85 250 69 250Z M91 226 L105 224 111 250 95 250Z"/></g><g fill="#e78aaa" stroke="#d66b96" stroke-width="1.2">${back?`<path d="M77 47 Q90 42 103 47 L100 88 90 96 80 88Z" opacity="${on('lats')||on('upper-back')||on('traps')?'1':'.10'}"/><path d="M78 91 L90 98 102 91 99 117 81 117Z" opacity="${on('spine')||on('upper-back')?'1':'.10'}"/>`:`<path d="M77 48 Q90 43 103 48 L100 75 90 81 80 75Z" opacity="${on('pectorals')?'1':'.10'}"/><path d="M83 83 L97 83 99 116 81 116Z" opacity="${on('abs')?'1':'.10'}"/>`}<path d="M69 53 L52 65 42 103 50 107 65 78Z M111 53 L128 65 138 103 130 107 115 78Z" opacity="${on('delts')||on('triceps')||on('biceps')?'1':'.10'}"/><path d="M76 127 L89 127 85 174 76 174Z M91 127 L104 127 104 174 95 174Z" opacity="${on('quads')||on('hamstrings')?'1':'.10'}"/><path d="M76 173 L86 174 83 220 74 220Z M94 174 L104 173 106 220 97 220Z" opacity="${on('hamstrings')||on('glutes')?'1':'.10'}"/><path d="M77 119 Q90 111 103 119 L104 137 Q90 147 76 137Z" opacity="${on('glutes')?'1':'.10'}"/></g></svg>`}
function openMuscles(name){let cfg=demoMap[name]||{muscles:['Músculos principais conforme o movimento'],groups:[]};let el=document.getElementById('muscleSheet');el.innerHTML=`<div class="muscle-top"><h2>Músculos trabalhados</h2><button class="muscle-close" onclick="closeMuscles()">×</button></div><p class="small">${name}</p><div class="bodymap"><div class="bodyfigure">${muscleSvg(cfg.groups||[],false)}<small>Vista anterior</small></div><div class="bodyfigure">${muscleSvg(cfg.groups||[],true)}<small>Vista posterior</small></div></div><div class="detail-heading">Principais músculos envolvidos</div><div class="muscle-list">${cfg.muscles.map(m=>`<span class="muscle-pill">${m}</span>`).join('')}</div><p class="small" style="margin-top:12px">Ilustração esquemática para orientação visual; a ativação pode variar conforme a execução.</p>`;document.getElementById('muscleOverlay').classList.add('show')}
function closeMuscles(){document.getElementById('muscleOverlay').classList.remove('show')}
function repsFor(it,n){let t=it[1];if(t.includes('8, 10 e 12'))return ['8','10','12'];if(t.includes('12 • 10 • 8'))return ['12','10','8'];if(t.includes('1 minuto'))return Array(n).fill('1 min');if(t.includes('ida e volta'))return Array(n).fill('Ida e volta');if(t.includes('10 cada lado'))return Array(n).fill('10/lado');if(t.includes('10 + 4 + 3'))return Array(n).fill('10 + 4 + 3');if(t.includes('10 + 8 + 6'))return Array(n).fill('10 + 8 + 6');if(t.includes('10 + 6 + 4'))return Array(n).fill('10 + 6 + 4');if(t.includes('10 + afundo'))return Array(n).fill('10 + afundo');if(t.includes('8, 10 e 12'))return ['8','10','12'];let m=t.match(/(\d+)\s*[×x]\s*(.*)/);return Array(n).fill(m?m[2]:'Conforme ficha')}
function tipFor(name){const tips={
'Elevação de Quadril com Barra':'Apoie a parte alta das costas no banco, mantenha os pés firmes e eleve o quadril até alinhar tronco e coxas. Evite hiperestender a lombar. Na série quebrada, faça as pausas curtas de 10–15 segundos indicadas na ficha.',
'Mesa Flexora':'Ajuste o rolo próximo aos tornozelos, mantenha o quadril apoiado e flexione os joelhos sem tirar o corpo do banco. Retorne devagar; a ficha orienta começar mais pesado e reduzir a carga.',
'Agachamento Sumô':'Afaste os pés além da largura dos ombros, pontas levemente para fora. Desça mantendo joelhos acompanhando a direção dos pés e tronco firme. Faça amplitude confortável.',
'Cadeira Flexora':'Mantenha o quadril encostado no assento e flexione os joelhos controlando a volta. Evite tirar o quadril do apoio.',
'Búlgaro com Halter':'Apoie o pé de trás no banco, mantenha o pé da frente firme e desça com controle. Faça as repetições de um lado e depois do outro, respeitando o intervalo entre as pernas.',
'Abdução de Quadril Máquina':'Mantenha o tronco estável e abra os joelhos sem impulso. Na ficha de posterior e glúteos, segure 3 segundos na posição aberta.',
'Abdominal Prancha Isométrica':'Apoie antebraços e pontas dos pés, mantenha o corpo alinhado e contraia o abdômen. Evite deixar o quadril cair ou subir demais.',
'Abdominal Remador':'Deite e eleve simultaneamente tronco e pernas, aproximando o tronco das coxas. Retorne com controle, sem puxar o pescoço.',
'Supino Inclinado com Halteres':'Mantenha as escápulas apoiadas, pés firmes e punhos alinhados. Desça os halteres controlando e empurre sem bater os pesos.',
'Peck Deck':'Ajuste o banco para as mãos ficarem aproximadamente na linha do peito. Feche os braços sem impulsionar e retorne até alongar confortavelmente.',
'Elevação Frontal com Halteres':'Eleve os halteres à frente até aproximadamente a altura dos ombros, sem balançar o tronco. Desça devagar.',
'Elevação Lateral Sentado com Halteres':'Sentada e com tronco estável, eleve os braços lateralmente até a altura confortável dos ombros. Evite encolher os ombros.',
'Tríceps na Polia com Corda':'Mantenha os cotovelos próximos ao tronco e estenda os braços para baixo. Separe levemente as pontas da corda no final, sem movimentar os ombros.',
'Tríceps Unilateral na Polia Alta (Pegada Neutra)':'Mantenha o cotovelo junto ao corpo e estenda o braço sem girar o tronco. Retorne devagar.',
'Agachamento Livre com Barra':'Mantenha a barra estável, abdômen firme e pés apoiados. A ficha pede cadência 3–1–1: 3 segundos descendo, 1 segundo de pausa e 1 segundo subindo; depois faça o afundo conforme prescrito.',
'Cadeira Extensora':'Ajuste o eixo da máquina à altura do joelho. Estenda sem dar impulso e retorne controlando. Na série quebrada, respeite as pausas curtas de 10–15 segundos e a associação indicada na ficha.',
'Leg Press 45':'Mantenha lombar e quadril apoiados, pés firmes na plataforma. Desça sem tirar o quadril do encosto e empurre sem travar os joelhos.',
'Passada com Halteres':'Dê um passo firme, desça com controle e mantenha o joelho acompanhando a ponta do pé. Complete ida e volta conforme a ficha.',
'Subida no Step':'Apoie todo o pé no step, suba impulsionando pela perna de cima e desça com controle. Faça a sequência quebrada com as pausas de 10–15 segundos indicadas.',
'Abdução de Quadril Máquina com Corpo à Frente':'Incline o tronco à frente mantendo a coluna neutra, apoie bem os pés e abra os joelhos sem impulso. Mantenha a mesma carga e repetições em todas as séries.',
'Stiff Unilateral':'Equilibre-se em uma perna, leve o quadril para trás e incline o tronco mantendo a coluna neutra. Desça até sentir alongar a parte posterior, sem girar a bacia.',
'Glúteos Coice na Polia':'Com o tronco estável, leve a perna para trás sem arquear a lombar. Faça o drop-set reduzindo a carga conforme orientação do instrutor.',
'Remada Unilateral Halteres — Pegada Neutra (Serrote)':'Apoie uma mão e mantenha a coluna neutra. Puxe o halter em direção ao quadril, sem girar o tronco.',
'Remada Cavalinho (Pegada Pronada)':'Mantenha o peito apoiado quando houver suporte, segure pronado e puxe os cotovelos para trás. Evite encolher os ombros.',
'Puxada Articulada Aberta':'Segure a barra aberta, mantenha o tronco firme e puxe em direção à parte alta do peito. Retorne controlando; a ficha associa à remada alta.',
'Desenvolvimento com Anilha':'Segure a anilha com firmeza e empurre acima da cabeça sem arquear a lombar. Desça até a amplitude confortável.',
'Rosca Alternada com Halteres':'Mantenha os cotovelos próximos ao corpo e alterne a flexão dos braços sem balançar o tronco.',
'Rosca Direta na Polia Baixa com Corda':'Mantenha os cotovelos junto ao tronco, flexione os braços e retorne devagar sem usar impulso.'};return tips[name]||'Faça o movimento com controle, mantenha a postura estável e respeite a amplitude confortável. Siga a orientação presencial do instrutor.'}
function restSeconds(v){let m=String(v).match(/(\d+)\s*s/i);return m?+m[1]:0}
function exerciseCard(pid,it,i){let ex=getEx(pid,i),n=setsFor(it[1]),reps=repsFor(it,n),rest=restSeconds(it[2]);return `<article class="exercise" id="ex-${pid}-${i}"><button class="ex-toggle" type="button" data-expand="${i}" data-pid="${pid}"><div class="num">${i+1}</div><div class="exname">${it[0]}<div class="exmeta" style="margin:7px 0 0"><span class="chip">${it[1]}</span><span class="chip">Descanso: ${it[2]==='—'?'não informado':it[2]}</span></div></div><span class="ex-chevron">⌄</span></button><div class="exercise-detail"><div class="detail-heading">Demonstração do movimento</div><div class="demo-frame" data-gif-name="${it[0]}"><div class="demo-wait">Carregando demonstração animada…</div></div><div class="detail-summary"><div><b>${n}</b><span>Séries prescritas</span></div><div><b>${it[1].replace(/^\d+\s*[×x]\s*/,'')}</b><span>Repetições / tempo</span></div><div><b>${it[2]==='—'?'—':it[2]}</b><span>Descanso entre séries</span></div></div><div class="detail-actions"><button type="button" data-muscles="${i}" data-pid="${pid}">◎ Ver músculos</button><button type="button" class="tips-toggle" data-tips="${pid}-${i}">✦ Como fazer e dicas</button></div><div class="tips-box" id="tips-${pid}-${i}">${tipFor(it[0])}${it[3]?'<br><br><b>Observação da ficha:</b> '+it[3]:''}</div><div class="exercise-clock"><div><small>Tempo total neste exercício</small><b id="exclock-${pid}-${i}">00:00</b></div><div class="clock-buttons"><button data-exclock-start="${pid}-${i}">Iniciar</button><button data-exclock-stop="${pid}-${i}">Pausar</button><button data-exclock-reset="${pid}-${i}">Zerar</button></div></div><div class="detail-heading">Séries e registro de carga</div><div class="mutedlabel">Registre as repetições realizadas e a carga usada em cada série.</div>${Array.from({length:n},(_,s)=>`<div class="set-item"><div class="setrow"><span>Série ${s+1}</span><input inputmode="decimal" placeholder="${reps[s]||'Reps'}" aria-label="Repetições série ${s+1}" data-reps="${pid}-${i}-${s}" value="${ex.sets[s]?.reps??''}"><input inputmode="decimal" placeholder="Carga kg" aria-label="Carga série ${s+1}" data-load="${pid}-${i}-${s}" value="${ex.sets[s]?.load??''}"><button class="${ex.sets[s]?.done?'done':''}" data-set="${pid}-${i}-${s}" aria-label="Concluir série">${ex.sets[s]?.done?'✓':'○'}</button></div><div class="set-rest"><small>${rest?`Descanso desta série: ${it[2]}`:'A ficha não informa o intervalo; 60s é apenas uma sugestão ajustável.'}</small>${rest?`<span><b id="restclock-${pid}-${i}-${s}">${fmt(rest)}</b> <button data-rest="${pid}-${i}-${s}" data-seconds="${rest}">Iniciar descanso</button></span>`:'<span><button data-rest="'+pid+'-'+i+'-'+s+'" data-seconds="60">Cronometrar 60s (sugestão)</button></span>'}</div></div>`).join('')}${(it[1].includes('10 + 4 + 3')||it[1].includes('10 + 8 + 6')||it[1].includes('10 + 6 + 4'))?'<div class="instruction">Nas séries quebradas, use o cronômetro de pausa curta de 10–15 segundos entre os blocos, conforme a prescrição.</div><button class="secondary" data-short-rest="${pid}-${i}">Iniciar pausa curta (15s)</button>':''}</div></article>`}
const exerciseIntervals={};const exerciseElapsed={};const exerciseStarted={};const restIntervals={};
function wireExercise(){document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{let pid=+b.dataset.pid,idx=+b.dataset.expand,card=document.getElementById(`ex-${pid}-${idx}`),was=card.classList.contains('open');card.classList.toggle('open',!was);if(!was){let demo=card.querySelector('[data-gif-name]');if(gifReady)fillGif(demo,demo.dataset.gifName)}});document.querySelectorAll('[data-muscles]').forEach(b=>b.onclick=()=>openMuscles(plans[+b.dataset.pid-1].items[+b.dataset.muscles][0]));document.querySelectorAll('[data-tips]').forEach(b=>b.onclick=()=>document.getElementById('tips-'+b.dataset.tips).classList.toggle('show'));document.querySelectorAll('[data-reps],[data-load]').forEach(inp=>inp.onchange=()=>{let [p,i,s]=(inp.dataset.reps||inp.dataset.load).split('-').map(Number),e=getEx(p,i);e.sets[s]=e.sets[s]||{};if(inp.dataset.reps)e.sets[s].reps=inp.value;else e.sets[s].load=inp.value;save()});document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{let [p,i,s]=b.dataset.set.split('-').map(Number),e=getEx(p,i);e.sets[s]=e.sets[s]||{};e.sets[s].done=!e.sets[s].done;save();b.classList.toggle('done',e.sets[s].done);b.textContent=e.sets[s].done?'✓':'○';toast(e.sets[s].done?'Série marcada como concluída':'Marcação desfeita')});document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startRest(b.dataset.rest,+b.dataset.seconds));document.querySelectorAll('[data-short-rest]').forEach(b=>b.onclick=()=>startRest('short-'+b.dataset.shortRest,15));document.querySelectorAll('[data-exclock-start]').forEach(b=>b.onclick=()=>startExerciseClock(b.dataset.exclockStart));document.querySelectorAll('[data-exclock-stop]').forEach(b=>b.onclick=()=>stopExerciseClock(b.dataset.exclockStop));document.querySelectorAll('[data-exclock-reset]').forEach(b=>b.onclick=()=>resetExerciseClock(b.dataset.exclockReset))}
function startRest(key,seconds){clearInterval(restIntervals[key]);let el=document.getElementById('restclock-'+key);let left=seconds;if(el)el.textContent=fmt(left);restIntervals[key]=setInterval(()=>{left--;if(el)el.textContent=fmt(Math.max(0,left));if(left<=0){clearInterval(restIntervals[key]);delete restIntervals[key];toast('Descanso finalizado!')}} ,1000)}
function startExerciseClock(key){if(exerciseIntervals[key])return;exerciseStarted[key]=Date.now()-(exerciseElapsed[key]||0)*1000;exerciseIntervals[key]=setInterval(()=>{let sec=Math.floor((Date.now()-exerciseStarted[key])/1000),el=document.getElementById('exclock-'+key);exerciseElapsed[key]=sec;if(el)el.textContent=fmt(sec)},1000)}
function stopExerciseClock(key){clearInterval(exerciseIntervals[key]);delete exerciseIntervals[key]}
function resetExerciseClock(key){stopExerciseClock(key);exerciseElapsed[key]=0;let el=document.getElementById('exclock-'+key);if(el)el.textContent='00:00'}
function progress(){let done=totalDone(),pct=Math.round(done/totalEx()*100);document.getElementById('app').innerHTML=`<div class="eyebrow">Acompanhamento</div><h1 class="page-title">Seu progresso</h1><p class="small">Resumo dos exercícios marcados como concluídos.</p><section class="hero" style="margin-top:18px"><div class="eyebrow">Conclusão das fichas</div><h1>${pct}%</h1><p>${done} de ${totalEx()} exercícios concluídos no total.</p><div class="progressbar"><i style="width:${pct}%"></i></div></section>${plans.map(p=>{let d=p.items.filter((_,i)=>completed(p.id,i)).length;return `<article class="workout-card"><div class="wtop"><b>Treino ${String.fromCharCode(64+p.id)} · ${p.title}</b><span class="small">${d}/${p.items.length}</span></div><div class="progressbar"><i style="width:${d/p.items.length*100}%"></i></div></article>`}).join('')}<p class="small">As cargas e marcações ficam salvas neste dispositivo.</p>`}
function historyPage(){let rows=[];plans.forEach(p=>p.items.forEach((it,i)=>{let e=data[p.id+'-'+i];if(e&&Object.values(e.sets||{}).some(s=>s.load||s.reps))rows.push({p,it,e})}));document.getElementById('app').innerHTML=`<div class="eyebrow">Registros</div><h1 class="page-title">Histórico de cargas</h1><p class="small">Pesos e repetições que você registrou em cada exercício.</p>${rows.length?rows.map(({p,it,e})=>`<article class="workout-card"><b>${it[0]}</b><div class="sub">Treino ${String.fromCharCode(64+p.id)} · ${p.title}</div><div class="meta">${Object.entries(e.sets).map(([s,v])=>`<span>Série ${+s+1}: ${v.load?v.load+' kg':'—'} · ${v.reps||'—'} reps</span>`).join('')}</div></article>`).join(''):'<div class="empty">Seus registros aparecerão aqui conforme você adicionar cargas e repetições.</div>'}<button class="secondary" id="export">Exportar meus registros</button>`;document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-treino-registros.json';a.click();URL.revokeObjectURL(url)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});render();loadExerciseGifs();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
