<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meu Treino"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Meu Treino</title>
<style>
:root{--pink:#d66b96;--pink-dark:#ad496f;--pink-soft:#fff0f5;--pink-pale:#fff8fb;--ink:#30272c;--muted:#8a7c83;--line:#f0e3e9;--white:#fff;--green:#398568;--shadow:0 8px 28px rgba(74,36,53,.07)}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:92px}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(13px + env(safe-area-inset-top)) 18px 13px}.topin{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.bow{width:38px;height:38px;border-radius:13px;background:var(--pink-soft);display:grid;place-items:center;color:var(--pink-dark);font-size:21px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px;font-weight:800}.brand strong{font-size:18px;letter-spacing:-.4px}.topright{font-size:12px;color:var(--muted)}main{max-width:760px;margin:auto;padding:20px 16px 30px}.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--pink-dark);font-weight:800}.hero{background:linear-gradient(135deg,#fff4f8,#fffafd);border:1px solid #f6e4ec;border-radius:22px;padding:21px;margin-bottom:20px;position:relative;overflow:hidden}.hero:after{content:'♡';position:absolute;right:16px;top:4px;font-size:76px;color:#f4d8e3;opacity:.6}.hero h1{font-size:25px;line-height:1.15;margin:7px 0}.hero p{margin:0;color:var(--muted);font-size:13px;max-width:80%;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:var(--muted)}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 11px}.sectionhead h2{font-size:17px;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:13px}.day{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 4px;text-align:center;color:var(--muted)}.day b{display:block;font-size:16px;color:var(--ink)}.day small{font-size:9px}.day.active{background:var(--pink);border-color:var(--pink);color:#fff}.day.active b{color:#fff}.workout-card{border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;background:#fff;box-shadow:var(--shadow)}.wtop{display:flex;justify-content:space-between;gap:12px}.tag{font-size:10px;color:var(--pink-dark);background:var(--pink-soft);padding:5px 8px;border-radius:20px;font-weight:750}.workout-card h3{margin:9px 0 4px;font-size:17px}.sub{font-size:12px;color:var(--muted);line-height:1.45}.meta{display:flex;gap:13px;margin-top:12px;color:var(--muted);font-size:11px;flex-wrap:wrap}.primary{border:0;background:var(--pink);color:white;font-weight:750;border-radius:12px;padding:12px 16px}.primary:active{background:var(--pink-dark)}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 13px;font-weight:650}.rowbtn{display:flex;gap:8px;margin-top:13px}.rowbtn button{flex:1}.exercise{border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0;background:#fff}.exhead{display:flex;gap:10px;align-items:flex-start}.num{flex:0 0 29px;height:29px;border-radius:10px;background:var(--pink-soft);color:var(--pink-dark);font-weight:800;display:grid;place-items:center;font-size:12px}.exname{font-weight:750;font-size:14px;line-height:1.35;flex:1}.check{width:25px;height:25px;border-radius:50%;border:1.5px solid #e7d6de;background:#fff;color:#fff;display:grid;place-items:center}.check.done{background:var(--green);border-color:var(--green)}.exmeta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0 39px}.chip{font-size:10px;background:#faf6f8;color:#75656d;border-radius:8px;padding:5px 8px}.note{margin:10px 0 0 39px;background:#fff7fa;border-left:3px solid #e6a4bd;padding:8px 10px;border-radius:0 9px 9px 0;color:#765a67;font-size:11px;line-height:1.45}.sets{margin:13px 0 0 39px;display:grid;gap:7px}.setrow{display:grid;grid-template-columns:55px 1fr 1fr 34px;gap:6px;align-items:center;font-size:11px;color:var(--muted)}.setrow input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:#fff;color:var(--ink);font-size:12px}.setrow button{border:1px solid var(--line);border-radius:8px;background:#fff;height:34px;color:var(--muted)}.setrow button.done{background:#eaf6f0;color:var(--green);border-color:#cce8da}.mutedlabel{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#9a8c93}.timerbox{background:var(--pink-pale);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;margin:15px 0}.timer{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px}.timeractions{display:flex;justify-content:center;gap:8px;margin-top:9px}.timeractions button{min-width:90px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}.tabsin{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tab{border:0;background:transparent;color:var(--muted);padding:7px 3px;border-radius:12px;font-size:10px}.tab span{display:block;font-size:18px;margin-bottom:2px}.tab.active{background:var(--pink-soft);color:var(--pink-dark);font-weight:800}.progressbar{height:7px;background:#f4e9ee;border-radius:20px;overflow:hidden;margin-top:10px}.progressbar i{height:100%;display:block;background:var(--pink);border-radius:20px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}.back{border:0;background:transparent;color:var(--pink-dark);font-weight:750;padding:5px 0;margin-bottom:12px}.page-title{font-size:23px;margin:4px 0}.small{font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#332a30;color:white;padding:10px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}.toast.show{opacity:1}@media(min-width:600px){main{padding-top:28px}.hero{padding:26px}.exercise{padding:17px}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand"><div class="bow">୨୧</div><div><small>FITNESS • TREINO</small><strong>Meu Treino</strong></div></div><div class="topright">Plano de hipertrofia</div></div></header><main id="app"></main><nav class="tabs"><div class="tabsin"><button class="tab active" data-tab="home"><span>⌂</span>Início</button><button class="tab" data-tab="progress"><span>↗</span>Progresso</button><button class="tab" data-tab="history"><span>▤</span>Histórico</button></div></nav><div class="toast" id="toast"></div>
<script>
const plans=[
{ id:1,title:'Posterior e glúteos',kind:'Inferiores',items:[
['Elevação de Quadril com Barra','3 séries quebradas: 10 + 4 + 3','120s','10 reps; descanso de 10–15s; +4 reps; descanso de 10–15s; +3 reps.'],
['Mesa Flexora','3 séries: 8, 10 e 12 reps','90s','Começar pesado e reduzir a carga a cada série.'],
['Agachamento Sumô','4 × 8 a 12','60s','Alternar com Cadeira Flexora.'],
['Cadeira Flexora','4 × 10 a 15','60s','Alternar com Agachamento Sumô.'],
['Búlgaro com Halter','3 × 8 a 12','60s','Intervalo entre as pernas.'],
['Abdução de Quadril Máquina','3 × 10 a 15','60s','Segurar 3 segundos na posição aberta em cada repetição.']]},
{ id:2,title:'Superiores — Dia 1',kind:'Superiores',items:[
['Abdominal Prancha Isométrica','3 × 1 minuto','—','Manter a posição isométrica.'],['Abdominal Remador','3 × 10 a 15','60s',''],['Supino Inclinado com Halteres','4 × 8 a 12','60s',''],['Peck Deck','4 × 10 a 15','60s',''],['Elevação Frontal com Halteres','4 × 10 a 15','60s','Alternar com Elevação Lateral Sentado.'],['Elevação Lateral Sentado com Halteres','4 × 10 a 15','60s','Alternar com Elevação Frontal.'],['Tríceps na Polia com Corda','3 × 10 a 15','60s','Com agachamento com step, conforme orientação do instrutor.'],['Tríceps Unilateral na Polia Alta (Pegada Neutra)','3 × 8 a 12','60s','']]},
{ id:3,title:'Quadríceps e foco geral',kind:'Inferiores',items:[
['Agachamento Livre com Barra','4 × 10 + afundo','60s','Cadência 3–1–1: 3s descendo, 1s de pausa e 1s subindo.'],['Cadeira Extensora','4 séries quebradas: 10 + 8 + 6','120s','10 reps; descanso de 10–15s; +8 reps; descanso de 10–15s; +6 reps. Associado à flexão nórdica reversa.'],['Leg Press 45','3 × 8 a 12','60s','Alternar com Passada com Halteres.'],['Passada com Halteres','3 × ida e volta','60s','Alternar com Leg Press 45.'],['Subida no Step','3 séries quebradas: 10 + 6 + 4','60s','10 reps; descanso de 10–15s; +6 reps; descanso de 10–15s; +4 reps.'],['Abdução de Quadril Máquina','3 × 15 a 20','60s','']]},
{ id:4,title:'Costas e bíceps',kind:'Superiores',items:[
['Abdominal Prancha Isométrica','3 × 1 minuto','60s',''],['Remada Unilateral Halteres — Pegada Neutra (Serrote)','3 × 10 a 15','60s',''],['Remada Cavalinho (Pegada Pronada)','4 × 8 a 12','60s',''],['Puxada Articulada Aberta','4 × 10 a 15','60s','Associada à remada alta.'],['Desenvolvimento com Anilha','4 × 10 a 15','60s','Alternar com Elevação Lateral Sentado.'],['Elevação Lateral Sentado com Halteres','4 × 10 a 15','60s','Alternar com Desenvolvimento com Anilha.'],['Rosca Alternada com Halteres','3 × 10 a 15','60s','Com agachamento com step, conforme orientação do instrutor.'],['Rosca Direta na Polia Baixa com Corda','3 × 8 a 12','60s','']]},
{ id:5,title:'Glúteos — ênfase específica',kind:'Inferiores',items:[
['Abdução de Quadril Máquina com Corpo à Frente','4 × 10 a 15','60s','Mesma carga e repetições em todas as séries; associado ao banco romano.'],['Stiff Unilateral','1ª: 12 • 2ª: 10 • 3ª: 8','90s','Aumentar a carga à medida que diminuem as repetições.'],['Glúteos Coice na Polia','1 × 8, 10 e 12','90s','Drop-set: começar pesado e reduzir a carga.'],['Cadeira Extensora','3 × 10 cada lado','60s','Após 10 reps com carga normal, reduzir 20% e continuar até a falha.'],['Passada com Halteres','3 × ida e volta','60s','Percurso indicado: piso verde.']]}
];
const KEY='meutreino_instrutor_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}');let currentTab='home',currentPlan=1,timerId=null,remaining=0;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function getEx(p,i){return data[p+'-'+i]||(data[p+'-'+i]={sets:{}})}function setsFor(ex){let m=ex.match(/^(\d+)\s*[×x]/i);if(m)return +m[1];if(ex.startsWith('3 séries'))return 3;return 3}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)}function completed(p,i){let x=data[p+'-'+i];return !!(x&&x.done)}function totalDone(){let n=0;plans.forEach(p=>p.items.forEach((_,i)=>{if(completed(p.id,i))n++}));return n}function totalEx(){return plans.reduce((a,p)=>a+p.items.length,0)}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));if(currentTab==='home')home();if(currentTab==='progress')progress();if(currentTab==='history')historyPage()}
function home(){let done=totalDone(),pct=Math.round(done/totalEx()*100);document.getElementById('app').innerHTML=`<section class="hero"><div class="eyebrow">Seu plano de treino</div><h1>Constância traz resultados.</h1><p>Treino de hipertrofia organizado conforme sua ficha. Registre suas cargas e acompanhe sua evolução.</p><div class="stats"><div class="stat"><b>${plans.length}</b><span>fichas</span></div><div class="stat"><b>${totalEx()}</b><span>exercícios</span></div><div class="stat"><b>${pct}%</b><span>concluído</span></div></div><div class="progressbar"><i style="width:${pct}%"></i></div></section><div class="sectionhead"><h2>Suas fichas</h2><span>Selecione para começar</span></div><div class="days">${plans.map(p=>`<button class="day ${currentPlan===p.id?'active':''}" data-plan="${p.id}"><b>${String.fromCharCode(64+p.id)}</b><small>${p.kind}</small></button>`).join('')}</div><div id="planDetail">${planCard(currentPlan)}</div>`;document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{currentPlan=+b.dataset.plan;home()});document.getElementById('startPlan').onclick=()=>openPlan(currentPlan)}
function planCard(id){let p=plans[id-1],n=p.items.filter((_,i)=>completed(id,i)).length;return `<article class="workout-card"><div class="wtop"><span class="tag">FICHA ${id} • ${p.kind.toUpperCase()}</span><span class="small">${n}/${p.items.length} concluídos</span></div><h3>${p.title}</h3><div class="sub">${p.items.length} exercícios · Hipertrofia específico · Iniciante</div><div class="progressbar"><i style="width:${n/p.items.length*100}%"></i></div><div class="meta"><span>◷ Descansos conforme ficha</span><span>♡ Registro de cargas</span></div><div class="rowbtn"><button class="primary" id="startPlan">Abrir treino</button></div></article>`}
function openPlan(id){currentPlan=id;currentTab='workout';renderWorkout()}
function renderWorkout(){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));let p=plans[currentPlan-1],n=p.items.filter((_,i)=>completed(currentPlan,i)).length;document.getElementById('app').innerHTML=`<button class="back" id="back">← Voltar às fichas</button><div class="eyebrow">FICHA ${currentPlan} • ${p.kind}</div><h1 class="page-title">${p.title}</h1><p class="small">${n} de ${p.items.length} exercícios concluídos</p><div class="progressbar"><i style="width:${n/p.items.length*100}%"></i></div><div class="timerbox"><div class="eyebrow">Cronômetro de descanso</div><div class="timer" id="timer">${fmt(remaining||90)}</div><div class="timeractions"><button class="secondary" id="timerStart">Iniciar 90s</button><button class="secondary" id="timerPause">Pausar</button><button class="secondary" id="timerReset">Zerar</button></div></div>${p.items.map((it,i)=>exerciseCard(p.id,it,i)).join('')}`;document.getElementById('back').onclick=()=>{currentTab='home';render()};document.getElementById('timerStart').onclick=()=>startTimer(90);document.getElementById('timerPause').onclick=()=>{clearInterval(timerId);timerId=null};document.getElementById('timerReset').onclick=()=>{clearInterval(timerId);timerId=null;remaining=0;document.getElementById('timer').textContent='00:00'};wireExercise()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function startTimer(sec){clearInterval(timerId);remaining=sec;document.getElementById('timer').textContent=fmt(remaining);timerId=setInterval(()=>{remaining--;let el=document.getElementById('timer');if(el)el.textContent=fmt(Math.max(0,remaining));if(remaining<=0){clearInterval(timerId);timerId=null;toast('Descanso finalizado')}} ,1000)}
function exerciseCard(pid,it,i){let ex=getEx(pid,i),n=setsFor(it[1]);let reps=it[1].includes('12, 10 e 8')?['12','10','8']:Array(n).fill(it[1].replace(/^\d+\s*[×x]\s*/,'').split(' ')[0]);if(it[1].includes('1 minuto'))reps=Array(n).fill('1 min');if(it[1].includes('ida e volta'))reps=Array(n).fill('Ida e volta');if(it[1].includes('10 cada lado'))reps=Array(n).fill('10/lado');if(it[1].includes('10 + 4 + 3'))reps=Array(n).fill('10+4+3');if(it[1].includes('10 + 8 + 6'))reps=Array(n).fill('10+8+6');if(it[1].includes('10 + 6 + 4'))reps=Array(n).fill('10+6+4');if(it[1].includes('8, 10 e 12'))reps=['8','10','12'];return `<article class="exercise"><div class="exhead"><div class="num">${i+1}</div><div class="exname">${it[0]}</div><button class="check ${ex.done?'done':''}" data-done="${i}" aria-label="Marcar concluído">${ex.done?'✓':''}</button></div><div class="exmeta"><span class="chip">${it[1]}</span><span class="chip">Descanso: ${it[2]}</span></div>${it[3]?`<div class="note">${it[3]}</div>`:''}<div class="sets"><div class="mutedlabel">Registro por série · carga em kg</div>${Array.from({length:n},(_,s)=>`<div class="setrow"><span>Série ${s+1}</span><input inputmode="decimal" placeholder="${reps[s]||'Reps'}" aria-label="Repetições série ${s+1}" data-reps="${i}-${s}" value="${ex.sets[s]?.reps??''}"><input inputmode="decimal" placeholder="0 kg" aria-label="Carga série ${s+1}" data-load="${i}-${s}" value="${ex.sets[s]?.load??''}"><button class="${ex.sets[s]?.done?'done':''}" data-set="${i}-${s}" aria-label="Concluir série">${ex.sets[s]?.done?'✓':'○'}</button></div>`).join('')}</div></article>`}
function wireExercise(){document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let e=getEx(currentPlan,+b.dataset.done);e.done=!e.done;save();renderWorkout()});document.querySelectorAll('[data-reps],[data-load]').forEach(inp=>inp.onchange=()=>{let [i,s]=(inp.dataset.reps||inp.dataset.load).split('-').map(Number),e=getEx(currentPlan,i);e.sets[s]=e.sets[s]||{};if(inp.dataset.reps)e.sets[s].reps=inp.value;else e.sets[s].load=inp.value;save()});document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{let [i,s]=b.dataset.set.split('-').map(Number),e=getEx(currentPlan,i);e.sets[s]=e.sets[s]||{};e.sets[s].done=!e.sets[s].done;save();b.classList.toggle('done',e.sets[s].done);b.textContent=e.sets[s].done?'✓':'○'})}
function progress(){let done=totalDone(),pct=Math.round(done/totalEx()*100);document.getElementById('app').innerHTML=`<div class="eyebrow">Acompanhamento</div><h1 class="page-title">Seu progresso</h1><p class="small">Resumo dos exercícios marcados como concluídos.</p><section class="hero" style="margin-top:18px"><div class="eyebrow">Conclusão das fichas</div><h1>${pct}%</h1><p>${done} de ${totalEx()} exercícios concluídos no total.</p><div class="progressbar"><i style="width:${pct}%"></i></div></section>${plans.map(p=>{let d=p.items.filter((_,i)=>completed(p.id,i)).length;return `<article class="workout-card"><div class="wtop"><b>Ficha ${p.id} · ${p.title}</b><span class="small">${d}/${p.items.length}</span></div><div class="progressbar"><i style="width:${d/p.items.length*100}%"></i></div></article>`}).join('')}<p class="small">As cargas e marcações ficam salvas neste dispositivo.</p>`}
function historyPage(){let rows=[];plans.forEach(p=>p.items.forEach((it,i)=>{let e=data[p.id+'-'+i];if(e&&Object.values(e.sets||{}).some(s=>s.load||s.reps))rows.push({p,it,e})}));document.getElementById('app').innerHTML=`<div class="eyebrow">Registros</div><h1 class="page-title">Histórico de cargas</h1><p class="small">Pesos e repetições que você registrou em cada exercício.</p>${rows.length?rows.map(({p,it,e})=>`<article class="workout-card"><b>${it[0]}</b><div class="sub">Ficha ${p.id} · ${p.title}</div><div class="meta">${Object.entries(e.sets).map(([s,v])=>`<span>Série ${+s+1}: ${v.load?v.load+' kg':'—'} · ${v.reps||'—'} reps</span>`).join('')}</div></article>`).join(''):'<div class="empty">Seus registros aparecerão aqui conforme você adicionar cargas e repetições.</div>'}<button class="secondary" id="export">Exportar meus registros</button>`;document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-treino-registros.json';a.click();URL.revokeObjectURL(url)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});render();
</script></body></html>
