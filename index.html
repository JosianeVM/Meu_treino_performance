function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function findGif(name){const cfg=demoMap[name];if(!cfg||!gifCatalog.length)return null;let best=null,bestScore=0;for(const e of gifCatalog){let nm=norm([e.name,e.slug].join(' '));if(!nm)continue;let score=0;for(const term of cfg.terms){let t=norm(term);if(nm===t)score=Math.max(score,130);else if(nm.includes(t))score=Math.max(score,100+Math.min(t.length,20));else if(t.includes(nm)&&nm.length>7)score=Math.max(score,80+nm.length)}if(score>bestScore){best=e;bestScore=score}}return bestScore>=82?best:null}
async function loadExerciseGifs(){try{let r=await fetch(GIF_BASE+'/api/es/exercises.json');if(!r.ok)throw Error('API indisponível');let d=await r.json();gifCatalog=Array.isArray(d)?d:(d.exercises||d.data||[]);gifReady=true;document.querySelectorAll('[data-gif-name]').forEach(el=>fillGif(el,el.dataset.gifName))}catch(e){gifReady=false;document.querySelectorAll('.demo-wait').forEach(el=>el.textContent='Não foi possível carregar a demonstração agora. Verifique a conexão com a internet.')}}
function fillGif(el,name){let match=findGif(name);if(match){let url=match.gifUrl||GIF_BASE+'/'+(match.file||match.id+'.gif');el.innerHTML=`<img src="${url}" alt="Demonstração de ${name}" loading="lazy"><div class="gif-caption">Demonstração animada do movimento</div>`}else{el.innerHTML=`<div class="demo-wait">Demonstração em GIF não encontrada para este movimento.<br><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' execução exercício')}" target="_blank" rel="noopener">Ver demonstração em vídeo ↗</a></div>`}}
function muscleSvg(groups,back){const on=(g)=>groups.includes(g);return `<svg viewBox="0 0 180 260" role="img" aria-label="Mapa muscular ${back?'posterior':'anterior'}"><g stroke="#c9b9c1" stroke-width="2" stroke-linejoin="round" fill="#f8edf2"><circle cx="90" cy="22" r="15"/><path d="M77 40 Q90 34 103 40 L112 54 108 105 100 127 80 127 72 105 68 54Z"/><path d="M68 52 L49 61 33 111 42 116 62 83 72 72Z M112 52 L131 61 147 111 138 116 118 83 108 72Z"/><path d="M80 125 L100 125 105 174 101 224 91 226 87 177 83 226 73 224 75 174Z"/><path d="M73 224 L87 226 85 250 69 250Z M91 226 L105 224 111 250 95 250Z"/></g><g fill="#e78aaa" stroke="#d66b96" stroke-width="1.2">${back?`<path d="M77 47 Q90 42 103 47 L100 88 90 96 80 88Z" opacity="${on('lats')||on('upper-back')||on('traps')?'1':'.10'}"/><path d="M78 91 L90 98 102 91 99 117 81 117Z" opacity="${on('spine')||on('upper-back')?'1':'.10'}"/>`:`<path d="M77 48 Q90 43 103 48 L100 75 90 81 80 75Z" opacity="${on('pectorals')?'1':'.10'}"/><path d="M83 83 L97 83 99 116 81 116Z" opacity="${on('abs')?'1':'.10'}"/>`}<path d="M69 53 L52 65 42 103 50 107 65 78Z M111 53 L128 65 138 103 130 107 115 78Z" opacity="${on('delts')||on('triceps')||on('biceps')?'1':'.10'}"/><path d="M76 127 L89 127 85 174 76 174Z M91 127 L104 127 104 174 95 174Z" opacity="${on('quads')||on('hamstrings')?'1':'.10'}"/><path d="M76 173 L86 174 83 220 74 220Z M94 174 L104 173 106 220 97 220Z" opacity="${on('hamstrings')||on('glutes')?'1':'.10'}"/><path d="M77 119 Q90 111 103 119 L104 137 Q90 147 76 137Z" opacity="${on('glutes')?'1':'.10'}"/></g></svg>`}
function openMuscles(name){let cfg=demoMap[name]||{muscles:['Músculos principais conforme o movimento'],groups:[]};let el=document.getElementById('muscleSheet');el.innerHTML=`<div class="muscle-top"><h2>Músculos trabalhados</h2><button class="muscle-close" onclick="closeMuscles()">×</button></div><p class="small">${name}</p><div class="bodymap"><div class="bodyfigure">${muscleSvg(cfg.groups||[],false)}<small>Vista anterior</small></div><div class="bodyfigure">${muscleSvg(cfg.groups||[],true)}<small>Vista posterior</small></div></div><div class="detail-heading">Principais músculos envolvidos</div><div class="muscle-list">${cfg.muscles.map(m=>`<span class="muscle-pill">${m}</span>`).join('')}</div><p class="small" style="margin-top:12px">Ilustração esquemática para orientação visual; a ativação pode variar conforme a execução.</p>`;document.getElementById('muscleOverlay').classList.add('show')}
function closeMuscles(){document.getElementById('muscleOverlay').classList.remove('show')}
function exerciseCard(pid,it,i){let ex=getEx(pid,i),n=setsFor(it[1]);let reps=it[1].includes('12, 10 e 8')?['12','10','8']:Array(n).fill(it[1].replace(/^\d+\s*[×x]\s*/,'').split(' ')[0]);if(it[1].includes('1 minuto'))reps=Array(n).fill('1 min');if(it[1].includes('ida e volta'))reps=Array(n).fill('Ida e volta');if(it[1].includes('10 cada lado'))reps=Array(n).fill('10/lado');if(it[1].includes('10 + 4 + 3'))reps=Array(n).fill('10+4+3');if(it[1].includes('10 + 8 + 6'))reps=Array(n).fill('10+8+6');if(it[1].includes('10 + 6 + 4'))reps=Array(n).fill('10+6+4');if(it[1].includes('8, 10 e 12'))reps=['8','10','12'];let cfg=demoMap[it[0]]||{muscles:['Consulte a orientação do instrutor'],groups:[]};return `<article class="exercise" id="ex-${pid}-${i}"><button class="ex-toggle" type="button" data-expand="${i}"><div class="num">${i+1}</div><div class="exname">${it[0]}<div class="exmeta" style="margin:7px 0 0"><span class="chip">${it[1]}</span><span class="chip">Descanso ${it[2]}</span></div></div><span class="ex-chevron">⌄</span></button><div class="exercise-detail"><div class="detail-heading">Execução do exercício</div><div class="demo-frame" data-gif-name="${it[0]}"><div class="demo-wait">Carregando demonstração animada…</div></div><div class="detail-summary"><div><b>${n}</b><span>Séries</span></div><div><b>${it[1].replace(/^\d+\s*[×x]\s*/,'')}</b><span>Repetições / tempo</span></div><div><b>${it[2]}</b><span>Descanso</span></div></div>${it[3]?`<div class="instruction">${it[3]}</div>`:''}<div class="demo-actions"><button type="button" data-muscles="${i}">◎ Ver músculos</button></div><div class="detail-heading">Registro de carga por série</div><div class="sets"><div class="mutedlabel">Repetições realizadas · carga em kg</div>${Array.from({length:n},(_,s)=>`<div class="setrow"><span>Série ${s+1}</span><input inputmode="decimal" placeholder="${reps[s]||'Reps'}" aria-label="Repetições série ${s+1}" data-reps="${i}-${s}" value="${ex.sets[s]?.reps??''}"><input inputmode="decimal" placeholder="0 kg" aria-label="Carga série ${s+1}" data-load="${i}-${s}" value="${ex.sets[s]?.load??''}"><button class="${ex.sets[s]?.done?'done':''}" data-set="${i}-${s}" aria-label="Concluir série">${ex.sets[s]?.done?'✓':'○'}</button></div>`).join('')}</div></div></article>`}
function wireExercise(){document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{let card=document.getElementById(`ex-${currentPlan}-${b.dataset.expand}`);let was=card.classList.contains('open');document.querySelectorAll('.exercise.open').forEach(x=>x.classList.remove('open'));if(!was){card.classList.add('open');let demo=card.querySelector('[data-gif-name]');if(gifReady)fillGif(demo,demo.dataset.gifName)}});document.querySelectorAll('[data-muscles]').forEach(b=>b.onclick=()=>openMuscles(plans[currentPlan-1].items[+b.dataset.muscles][0]));document.querySelectorAll('[data-reps],[data-load]').forEach(inp=>inp.onchange=()=>{let [i,s]=(inp.dataset.reps||inp.dataset.load).split('-').map(Number),e=getEx(currentPlan,i);e.sets[s]=e.sets[s]||{};if(inp.dataset.reps)e.sets[s].reps=inp.value;else e.sets[s].load=inp.value;save()});document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{let [i,s]=b.dataset.set.split('-').map(Number),e=getEx(currentPlan,i);e.sets[s]=e.sets[s]||{};e.sets[s].done=!e.sets[s].done;save();b.classList.toggle('done',e.sets[s].done);b.textContent=e.sets[s].done?'✓':'○'})}
function progress(){let done=totalDone(),pct=Math.round(done/totalEx()*100);document.getElementById('app').innerHTML=`<div class="eyebrow">Acompanhamento</div><h1 class="page-title">Seu progresso</h1><p class="small">Resumo dos exercícios marcados como concluídos.</p><section class="hero" style="margin-top:18px"><div class="eyebrow">Conclusão das fichas</div><h1>${pct}%</h1><p>${done} de ${totalEx()} exercícios concluídos no total.</p><div class="progressbar"><i style="width:${pct}%"></i></div></section>${plans.map(p=>{let d=p.items.filter((_,i)=>completed(p.id,i)).length;return `<article class="workout-card"><div class="wtop"><b>Treino ${String.fromCharCode(64+p.id)} · ${p.title}</b><span class="small">${d}/${p.items.length}</span></div><div class="progressbar"><i style="width:${d/p.items.length*100}%"></i></div></article>`}).join('')}<p class="small">As cargas e marcações ficam salvas neste dispositivo.</p>`}
function historyPage(){let rows=[];plans.forEach(p=>p.items.forEach((it,i)=>{let e=data[p.id+'-'+i];if(e&&Object.values(e.sets||{}).some(s=>s.load||s.reps))rows.push({p,it,e})}));document.getElementById('app').innerHTML=`<div class="eyebrow">Registros</div><h1 class="page-title">Histórico de cargas</h1><p class="small">Pesos e repetições que você registrou em cada exercício.</p>${rows.length?rows.map(({p,it,e})=>`<article class="workout-card"><b>${it[0]}</b><div class="sub">Treino ${String.fromCharCode(64+p.id)} · ${p.title}</div><div class="meta">${Object.entries(e.sets).map(([s,v])=>`<span>Série ${+s+1}: ${v.load?v.load+' kg':'—'} · ${v.reps||'—'} reps</span>`).join('')}</div></article>`).join(''):'<div class="empty">Seus registros aparecerão aqui conforme você adicionar cargas e repetições.</div>'}<button class="secondary" id="export">Exportar meus registros</button>`;document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-treino-registros.json';a.click();URL.revokeObjectURL(url)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render()});render();loadExerciseGifs();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
